[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Ava LiveKit voice agent — Shellharbour / Dapto / Woonona phone receptionist"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[openai]>=1.8.1",
    "livekit-plugins-ai-coustics~=0.2",
    "livekit-plugins-assemblyai>=1.6.4",
    "livekit-plugins-cartesia>=1.6.4",
    "livekit-plugins-groq>=1.6.4",
    "python-dotenv",
    "supabase>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "livekit-plugins-noise-cancellation>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"*" = ["audio/fillers/*.json", "audio/fillers/*.md", "audio/fillers/**/*.wav"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["agent", "ambient", "availability_cache", "ava_receptionist", "backchannel", "booking", "booking_state", "call_log", "call_state", "caller_store", "date_context", "dead_air", "demo_harness", "desk_events", "filler_bank", "filler_ladder", "filler_player", "grounding", "make_call", "never_silent_harness", "never_silent_recorder", "persona", "phrase_pools", "portal", "practice", "realtime_hygiene", "run_local", "sip_utils", "startup_checks", "turn_filter"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
